name: Android CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
    branches:
      - main

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept SDK licenses and install platform 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME is not set"
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
